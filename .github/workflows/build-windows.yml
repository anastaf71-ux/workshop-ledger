name: Build Windows EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run database tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Qt UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python app.py --self-test
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WorkshopLedger app.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          & .\dist\WorkshopLedger.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopLedger-Windows
          path: dist/WorkshopLedger.exe
          if-no-files-found: error
