name: Build Windows EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run database tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Qt UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python app.py --self-test
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WorkshopLedger app.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          # Windows GUI applications can launch asynchronously with '&'.
          # Wait explicitly and check the actual process exit code.
          $exe = Join-Path $PWD.Path 'dist\WorkshopLedger.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0) {
            throw "Packaged GUI self-test failed with exit code $($process.ExitCode)"
          }
          Write-Host 'Packaged Windows executable smoke-test passed'
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopLedger-Windows
          path: dist/WorkshopLedger.exe
          if-no-files-found: error
